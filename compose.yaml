name: swasthya-sathi
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: swasthya
      POSTGRES_USER: swasthya
      POSTGRES_PASSWORD: swasthya
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U swasthya"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: replace-me-local-only }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["object-data:/data"]
volumes: { postgres-data: {}, redis-data: {}, object-data: {} }
