name: deploy-api

# Builds deploy/Dockerfile.api for arm64 (the dedicated server's
# architecture) and pushes it to GHCR whenever `ci` finishes successfully on
# `main` — never on a raw push, so a broken commit can't publish an image.
# The server pulls the tag; this workflow never touches the server itself
# (see docs/deployment/dedicated-server.md).
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/merohealth-api:latest
            ghcr.io/${{ github.repository_owner }}/merohealth-api:${{ github.event.workflow_run.head_sha }}
