name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.10.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.6.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @swasthya/mobile exec expo export --platform web
        env: { EXPO_PUBLIC_API_URL: "http://localhost:4000" }
