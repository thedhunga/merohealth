name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 22:15 UTC = 04:00 Nepal: the real journeys against production,
    # including live answers.
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.10.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.6.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @swasthya/mobile exec expo export --platform web
        env: { EXPO_PUBLIC_API_URL: "http://localhost:4000" }
      # Publishes the export to apps/web/public/app so the deterministic e2e
      # journeys below can actually reach /app instead of it 404ing — see
      # scripts/build-mobile-web.sh (same publish step, factored out so
      # production and CI never drift on how /app gets built).
      - run: rm -rf apps/web/public/app && mkdir -p apps/web/public/app && cp -r apps/mobile/dist/. apps/web/public/app/
      - run: pnpm turbo build --filter=@swasthya/web...
      - run: pnpm --filter @swasthya/web exec playwright install --with-deps chromium
      - run: pnpm --filter @swasthya/web check:budget
      # User-journey tests, phone profile, against the built app. Deterministic
      # journeys only (safety, containment, premium coming-soon, PWA, layout);
      # live-answer journeys run nightly against production below.
      - run: pnpm --filter @swasthya/web exec playwright test --project=phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  journeys-production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.6.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swasthya/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @swasthya/web exec playwright test --project=phone --project=iphone
        env:
          E2E_BASE_URL: https://merohealth-beta.vercel.app
          E2E_LIVE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report-production, path: apps/web/playwright-report, retention-days: 14 }
