name: mero-health
services:
  caddy:
    image: caddy:2.10-alpine
    profiles: ['standalone']
    restart: unless-stopped
    environment:
      MERO_DOMAIN: ${MERO_DOMAIN:-:80}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - '${MERO_BIND_IP:-127.0.0.1}:${MERO_HTTP_PORT:-8090}:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mero_health}
      POSTGRES_USER: ${POSTGRES_USER:-mero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.server}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Loopback only. Nothing outside this host should ever reach the database;
    # the API talks to it over the compose network by service name.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mero} -d ${POSTGRES_DB:-mero_health}']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. Deliberately a
  # separate service rather than something the API does on boot — a failed
  # migration must never crash-loop the API, and a half-applied schema is far
  # easier to reason about when the step that applied it has its own logs and
  # its own exit code.
  migrate:
    image: ghcr.io/thedhunga/merohealth-api:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - .env.server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mero}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mero_health}
    command: ['sh', '-c', 'cd packages/database && npx prisma migrate deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/thedhunga/merohealth-api:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mero}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mero_health}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
